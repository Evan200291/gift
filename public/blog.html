<!DOCTYPE html>
<html lang="en" data-title="Blog — %s">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080d">
<title>Blog</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
</head>

<body class="lang-en">

<header data-header></header>

<main class="shell">
    <nav class="crumbs" aria-label="Breadcrumb">
        <a href="/" data-i18n="navHome">Home</a>
        <span class="sep">/</span>
        <span class="dim" data-i18n="navBlog">Blog</span>
    </nav>

    <section class="section-sm">
        <div class="section-head">
            <div>
                <span class="eyebrow" data-i18n="navBlog">Blog</span>
                <h2 data-i18n="blogTitle">From the blog</h2>
                <p data-i18n="blogSub">Guides, patch notes and safe-trading advice.</p>
            </div>
        </div>
        <div class="post-grid" id="postGrid"></div>
        <div class="pagination" id="pagination"></div>
    </section>

    <section class="section-sm">
        <div data-ad="footer" data-ad-variant="wide"></div>
    </section>
</main>

<footer data-footer></footer>

<script src="/js/i18n.js"></script>
<script src="/js/core.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/pages/blog.js"></script>

</html>
