<!DOCTYPE html>
<html lang="en" data-title="Sellers — %s">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080d">
<title>Sellers</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
</head>

<body class="lang-en">

<header data-header></header>

<main class="shell">
    <nav class="crumbs" aria-label="Breadcrumb">
        <a href="/" data-i18n="navHome">Home</a>
        <span class="sep">/</span>
        <span class="dim" data-i18n="navSellers">Sellers</span>
    </nav>

    <section class="section-sm">
        <div class="section-head-sm">
            <h2 class="section-title-sm" data-i18n="sellersTitle">Trusted sellers</h2>
            <a class="btn btn-primary btn-sm" href="/sell" data-i18n="navSell">Sell with us</a>
        </div>
        <div class="search" id="searchWrap" style="max-width:360px;margin-bottom:16px;">
            <span class="ico" id="searchIcon"></span>
            <input type="search" id="sellerSearch" autocomplete="off"
                   data-i18n-ph="searchSellersPlaceholder" placeholder="Search sellers…"
                   data-i18n-aria="searchSellersPlaceholder" aria-label="Search sellers">
            <button type="button" class="clear" id="searchClear" data-i18n-aria="clearSearch" aria-label="Clear"></button>
        </div>
        <div class="seller-grid" id="sellerGrid"></div>
    </section>

    <section class="section-sm">
        <div data-ad="footer" data-ad-variant="wide"></div>
    </section>
</main>

<footer data-footer></footer>

<script src="/js/i18n.js"></script>
<script src="/js/core.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/pages/sellers.js"></script>
</body>
</html>
