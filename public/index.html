<!DOCTYPE html>
<html lang="en" data-title="%s — Game Account Marketplace">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080d">
<meta name="description" content="Buy eFootball, Mobile Legends, PUBG Mobile and Free Fire accounts from verified resellers. Contact sellers directly — no buyer account needed.">
<title>Game Account Marketplace</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
</head>

<body class="lang-en">

<header data-header></header>

<main>
    <!-- ========== Hero ========== -->
    <section class="hero">
        <div class="hero-banner" id="heroBanner" aria-roledescription="carousel" aria-label="EXABYTE">
            <div class="hero-track" id="heroTrack">
                <img class="hero-banner-img" src="/img/hero-banner.svg"
                     alt="EXABYTE — buy and sell eFootball, Mobile Legends, PUBG Mobile and Free Fire accounts"
                     width="1800" height="640" loading="eager" decoding="async">
                <img class="hero-banner-img" src="/img/hero-banner-2.svg"
                     alt="Verified sellers — contact them directly, no sign-up needed"
                     width="1800" height="640" loading="eager" decoding="async">
            </div>
            <div class="hero-dots" id="heroDots" role="tablist" aria-label="Banner slides"></div>
        </div>
        <div class="shell hero-inner">
            <div class="hero-copy">
                <div class="hero-stats">
                    <div class="stat-chip">
                        <span class="stat-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="14" height="13" rx="1.5"/><path d="M7 3h13a1 1 0 0 1 1 1v12"/></svg></span>
                        <b id="statAccounts" class="tabular">—</b>
                        <span class="stat-label" data-i18n="statAccounts">Live accounts</span>
                    </div>
                    <div class="stat-chip">
                        <span class="stat-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 5 6v5c0 4.5 3 8.3 7 10 4-1.7 7-5.5 7-10V6z"/><path d="m9 12 2.2 2.2L15.5 10"/></svg></span>
                        <b id="statSellers" class="tabular">—</b>
                        <span class="stat-label" data-i18n="statSellers">Verified sellers</span>
                    </div>
                    <div class="stat-chip">
                        <span class="stat-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="7" width="19" height="11" rx="5.5"/><path d="M7.5 10.5v4M5.5 12.5h4"/><circle cx="15.5" cy="11.5" r="1" fill="currentColor" stroke="none"/><circle cx="17.5" cy="13.5" r="1" fill="currentColor" stroke="none"/></svg></span>
                        <b id="statGames" class="tabular">4</b>
                        <span class="stat-label" data-i18n="statGames">Games covered</span>
                    </div>
                </div>
            </div>

            <div class="hero-visual">
                <div class="top-sellers">
                    <div class="top-sellers-head">
                        <span class="top-sellers-title" data-i18n="trustedSellers">Trusted sellers</span>
                        <a class="view-all" href="/sellers"><span data-i18n="viewAll">View all</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></a>
                    </div>
                    <div class="top-sellers-grid" id="heroHudGrid"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- ========== Ad · leaderboard ========== -->
    <section class="section-sm">
        <div class="shell"><div data-ad="home-leaderboard" data-ad-variant="wide"></div></div>
    </section>

    <!-- ========== Categories ========== -->
    <section class="section-sm">
        <div class="shell">
            <h2 class="section-title-sm" data-i18n="categoriesTitle">Pick your game</h2>
            <div class="cat-rail" id="catRail"></div>
        </div>
    </section>

    <!-- ========== Listings ========== -->
    <section id="listings" class="section">
        <div class="shell">
            <div class="search" id="searchWrap" style="max-width:420px;margin-bottom:14px;">
                <span class="ico" id="searchIcon"></span>
                <input type="search" id="searchInput" autocomplete="off"
                       data-i18n-ph="searchPlaceholder" placeholder="Search…"
                       data-i18n-aria="searchPlaceholder" aria-label="Search">
                <button type="button" class="clear" id="searchClear" data-i18n-aria="clearSearch" aria-label="Clear"></button>
            </div>

            <div class="chips" id="homeGameChips"></div>

            <div id="grid" class="grid" aria-live="polite"></div>

            <div class="listings-more">
                <a class="view-all" href="/browse" id="viewMoreBtn"><span data-i18n="viewAll">View all</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></a>
            </div>
        </div>
    </section>

    <!-- ========== Sellers ========== -->
    <section class="section-sm">
        <div class="shell">
            <div class="section-head-sm">
                <h2 class="section-title-sm" data-i18n="sellersTitle">Trusted sellers</h2>
                <a class="view-all" href="/sellers"><span data-i18n="viewAll">View all</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></a>
            </div>
            <div class="seller-grid" id="sellerGrid"></div>
        </div>
    </section>

    <!-- ========== Blog ========== -->
    <section class="section-sm" id="blogSection" hidden>
        <div class="shell">
            <div class="section-head-sm">
                <h2 class="section-title-sm" data-i18n="blogTitle">From the blog</h2>
                <a class="view-all" href="/blog"><span data-i18n="viewAll">View all</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></a>
            </div>
            <div class="post-grid" id="postGrid"></div>
        </div>
    </section>

    <!-- ========== Ad · footer ========== -->
    <section class="ad-footer-section">
        <div class="shell"><div data-ad="footer" data-ad-variant="wide"></div></div>
    </section>
</main>

<footer data-footer></footer>

<script src="/js/i18n.js"></script>
<script src="/js/core.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/pages/home.js"></script>
</body>
</html>
