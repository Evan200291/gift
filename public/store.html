<!DOCTYPE html>
<html lang="en" data-title="Store — %s">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F4FC">
<script src="/js/theme.js"></script>
<title>Seller store</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
</head>

<body class="lang-en">

<header data-header></header>

<main class="shell">
    <nav class="crumbs" aria-label="Breadcrumb">
        <a href="/" data-i18n="navHome">Home</a>
        <span class="sep">/</span>
        <a href="/sellers" data-i18n="navSellers">Sellers</a>
        <span class="sep">/</span>
        <span class="dim" id="crumbName">…</span>
    </nav>

    <div id="storeHead"></div>

    <div class="section-head-sm store-listings-head" id="storeListingsHead" hidden>
        <h2 class="section-title-sm"><span data-i18n="storeAccountsTitle">Accounts for sale</span> <span class="store-count tabular" id="resultCount"></span></h2>
    </div>

    <div id="grid" class="grid store-grid" aria-live="polite"></div>

    <section class="section-sm">
        <div data-ad="footer" data-ad-variant="wide"></div>
    </section>
</main>

<footer data-footer></footer>

<script src="/js/i18n.js"></script>
<script src="/js/core.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/pages/store.js"></script>
</body>
</html>
