<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Details · eFootball Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>">
</head>
<body class="lang-en">

<nav class="navbar">
    <div class="nav-inner">
        <a href="/" class="logo" style="text-decoration:none;">
            <span class="logo-mark">e</span>
            <span class="logo-text">eFootball Store<small>Premium Mobile Accounts</small></span>
        </a>
        <ul class="nav-links">
            <li><a href="/" data-page="home" data-i18n="home">Home</a></li>
            <li><a href="/admin.html" data-page="admin" data-i18n="admin">Admin</a></li>
            <li>
                <div class="lang-switch">
                    <button data-lang="en">EN</button>
                    <button data-lang="mm">မြန်မာ</button>
                </div>
            </li>
        </ul>
    </div>
</nav>

<main class="container">
    <p style="margin:20px 0;">
        <a href="/" data-i18n="backToList" class="btn btn-ghost btn-sm" style="padding-left:8px;">← <span>Back to listings</span></a>
    </p>
    <div id="content">
        <div class="loader">Loading...</div>
    </div>
</main>

<footer class="footer">
    <p>© <span id="year"></span> eFootball Account Reseller · Made with ⚽ for gamers</p>
</footer>

<script src="/js/app.js"></script>
<script>
    let currentAccount = null;
    let activeIdx = 0;

    document.getElementById('year').textContent = new Date().getFullYear();

    function getId() {
        const params = new URLSearchParams(location.search);
        return params.get('id');
    }

    function escapeHtml(s) {
        if (s == null) return '';
        return String(s).replace(/[&<>"']/g, (c) => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        })[c]);
    }

    function renderAccount(acc) {
        const images = acc.images || [];
        const mainImg = images[activeIdx] || '';
        const thumbs = images.map((src, i) => `
            <div class="thumb ${i === activeIdx ? 'active' : ''}" data-idx="${i}">
                <img src="${escapeHtml(src)}" alt="">
            </div>
        `).join('');

        const descEn = acc.description_en
            ? `<div class="detail-section"><h3>Description <span class="lang-tag">EN</span></h3><p>${escapeHtml(acc.description_en)}</p></div>` : '';
        const descMm = acc.description_mm
            ? `<div class="detail-section"><h3>ဖော်ပြချက် <span class="lang-tag">MM</span></h3><p>${escapeHtml(acc.description_mm)}</p></div>` : '';

        const featured = acc.featured_players
            ? `<div class="detail-section"><h3 data-i18n="featuredPlayers">Featured Players</h3><p>${escapeHtml(acc.featured_players)}</p></div>` : '';

        const contact = acc.contact_info
            ? `<div class="detail-section">
                <h3 data-i18n="contact">Contact</h3>
                <p id="contactText" style="font-weight:600;color:var(--text);font-size:1.05rem;">${escapeHtml(acc.contact_info)}</p>
                <button class="btn btn-secondary btn-sm" id="copyContactBtn" style="margin-top:10px;">📋 <span data-i18n="copyContact">Copy</span></button>
               </div>`
            : `<div class="detail-section"><h3 data-i18n="contact">Contact</h3><p data-i18n="contactEmpty" style="color:var(--text-dim);">No contact info provided.</p></div>`;

        return `
        <div class="detail-wrap">
            <div class="detail-images">
                <div class="detail-main-frame" id="mainFrame">
                    <div class="phone-screen">
                        ${mainImg
                            ? `<img id="mainImg" src="${escapeHtml(mainImg)}" alt="">`
                            : `<span class="placeholder">${t('emptyStateIcon')}</span>`}
                    </div>
                    ${images.length > 1 ? `<div class="phone-dots">${images.map((_, i) => `<span class="${i === activeIdx ? 'active' : ''}"></span>`).join('')}</div>` : ''}
                </div>
                ${images.length > 1 ? `
                    <div class="thumbs" id="thumbs">${thumbs}</div>
                    <div style="display:flex;gap:8px;margin-top:10px;">
                        <button class="btn btn-secondary btn-sm" id="prevBtn" title="Previous">‹</button>
                        <button class="btn btn-secondary btn-sm" id="nextBtn" title="Next">›</button>
                    </div>` : ''}
            </div>

            <div class="detail-info">
                ${renderStatus(acc.status)}
                ${acc.title_en ? `<h1>${escapeHtml(acc.title_en)}</h1>` : ''}
                ${acc.title_mm ? `<div class="title-mm">${escapeHtml(acc.title_mm)}</div>` : ''}
                <div class="detail-price">
                    <span class="label" data-i18n="price">Price</span>
                    <span class="amount">${formatPrice(acc.price)}</span>
                </div>

                <div class="detail-grid">
                    ${acc.overall_rating ? `<div class="detail-stat"><label data-i18n="overallRating">Overall Rating</label><span class="value">${escapeHtml(acc.overall_rating)}</span></div>` : ''}
                    ${acc.coins ? `<div class="detail-stat"><label data-i18n="coins">Coins</label><span class="value">${escapeHtml(acc.coins)}</span></div>` : ''}
                </div>

                ${contact}
                ${featured}
                ${descEn}
                ${descMm}

                ${acc.contact_info ? `<a href="https://t.me/${escapeHtml(acc.contact_info.replace(/[^a-zA-Z0-9_]/g, ''))}" target="_blank" class="btn btn-primary btn-block" data-i18n="contactSeller" style="margin-top:16px;">💬 Contact Seller</a>` : ''}
            </div>
        </div>
        `;
    }

    function attachHandlers() {
        document.querySelectorAll('.thumb').forEach((el) => {
            el.addEventListener('click', () => {
                activeIdx = parseInt(el.dataset.idx, 10);
                rerender();
            });
        });
        const prev = document.getElementById('prevBtn');
        const next = document.getElementById('nextBtn');
        if (prev) prev.addEventListener('click', () => {
            if (!currentAccount) return;
            const n = (currentAccount.images || []).length;
            activeIdx = (activeIdx - 1 + n) % n;
            rerender();
        });
        if (next) next.addEventListener('click', () => {
            if (!currentAccount) return;
            const n = (currentAccount.images || []).length;
            activeIdx = (activeIdx + 1) % n;
            rerender();
        });
        const copyBtn = document.getElementById('copyContactBtn');
        if (copyBtn) copyBtn.addEventListener('click', () => {
            const text = (document.getElementById('contactText') || {}).textContent || '';
            navigator.clipboard.writeText(text).then(() => {
                showToast(t('copied'), 'success');
            }).catch(() => {
                showToast('Copy failed', 'error');
            });
        });
    }

    function rerender() {
        document.getElementById('content').innerHTML = renderAccount(currentAccount);
        attachHandlers();
        setLang(getLang());
    }

    async function load() {
        const id = getId();
        if (!id) {
            document.getElementById('content').innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><p>${t('notFound')}</p></div>`;
            return;
        }
        try {
            // Apply brand from site settings before rendering
            try {
                const settings = await fetch('/api/site').then((r) => r.json());
                const brandEl = document.querySelector('.logo-text');
                if (brandEl) {
                    brandEl.innerHTML = `${escapeHtml(settings.brand || 'eFootball Store')}<small>${escapeHtml(settings.tagline || 'Premium Mobile Accounts')}</small>`;
                }
                document.title = `${settings.brand || 'eFootball Account Reseller'} · ${t('accountDetails') || 'Account'}`;
            } catch {}
            const res = await fetch(`/api/accounts/${id}`);
            if (!res.ok) throw new Error('Not found');
            currentAccount = await res.json();
            rerender();
        } catch (err) {
            document.getElementById('content').innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><p>${t('notFound')}</p></div>`;
        }
    }

    document.addEventListener('langchange', () => {
        if (currentAccount) rerender();
    });

    load();
</script>

</body>
</html>
