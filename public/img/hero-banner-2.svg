<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" role="img" aria-label="EXABYTE verified sellers: contact sellers directly, no sign-up. Subscribed resellers, direct contact, 4 games.">
  <defs>
    <!-- Background -->
    <linearGradient id="b2-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1830"/>
      <stop offset=".5" stop-color="#0C1F3D"/>
      <stop offset="1" stop-color="#080F1E"/>
    </linearGradient>
    <radialGradient id="b2-halo" gradientUnits="userSpaceOnUse" cx="450" cy="192" r="420">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".34"/>
      <stop offset=".35" stop-color="#0FA7A0" stop-opacity=".12"/>
      <stop offset="1" stop-color="#0FA7A0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b2-blueglow" gradientUnits="userSpaceOnUse" cx="1250" cy="120" r="520">
      <stop offset="0" stop-color="#1856E8" stop-opacity=".30"/>
      <stop offset="1" stop-color="#1856E8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b2-ray" gradientUnits="userSpaceOnUse" cx="450" cy="192" r="1100">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".22"/>
      <stop offset=".6" stop-color="#22D3EE" stop-opacity=".04"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="b2-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080F1E" stop-opacity="0"/>
      <stop offset="1" stop-color="#080F1E" stop-opacity=".85"/>
    </linearGradient>

    <!-- Hex pattern, faded out from the emblem -->
    <pattern id="b2-hex" width="54" height="31.18" patternUnits="userSpaceOnUse" patternTransform="scale(1.25)">
      <path d="M0 15.59L9 0H27L36 15.59L27 31.18H9ZM36 15.59H54" fill="none" stroke="#4B85FF" stroke-width=".8"/>
    </pattern>
    <radialGradient id="b2-hexfade" gradientUnits="userSpaceOnUse" cx="560" cy="210" r="760">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".05"/>
    </radialGradient>
    <mask id="b2-hexmask"><rect width="1600" height="500" fill="url(#b2-hexfade)"/></mask>

    <!-- Emblem -->
    <linearGradient id="b2-plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12294B"/>
      <stop offset="1" stop-color="#0A1830"/>
    </linearGradient>
    <linearGradient id="b2-shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D5A9E"/>
      <stop offset=".55" stop-color="#14305A"/>
      <stop offset="1" stop-color="#0A1830"/>
    </linearGradient>
    <linearGradient id="b2-core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E2A4C"/>
      <stop offset="1" stop-color="#081427"/>
    </linearGradient>
    <linearGradient id="b2-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A5F3FC"/>
      <stop offset=".45" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#1856E8"/>
    </linearGradient>
    <linearGradient id="b2-check" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#5EEAD4"/>
    </linearGradient>

    <!-- Text -->
    <linearGradient id="b2-head1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C9DAFF"/>
    </linearGradient>
    <linearGradient id="b2-head2" gradientUnits="userSpaceOnUse" x1="660" y1="0" x2="1140" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#4B85FF"/>
    </linearGradient>
    <linearGradient id="b2-chip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#113A5C" stop-opacity=".95"/>
      <stop offset="1" stop-color="#0B1C36" stop-opacity=".9"/>
    </linearGradient>

    <filter id="b2-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- ============ BACKGROUND (bleeds to all edges) ============ -->
  <rect width="1600" height="500" fill="url(#b2-bg)"/>
  <rect width="1600" height="500" fill="url(#b2-blueglow)"/>
  <rect width="1600" height="500" fill="url(#b2-hex)" mask="url(#b2-hexmask)" opacity=".5"/>

  <!-- Light rays from the emblem -->
  <g fill="url(#b2-ray)">
    <polygon points="450,192 1737,11 1748,124"/>
    <polygon points="450,192 1721,462 1706,529"/>
    <polygon points="450,192 -806,-145 -772,-253"/>
    <polygon points="450,192 -772,637 -811,506"/>
    <polygon points="450,192 1100,-934 1251,-832"/>
    <polygon points="450,192 1100,1318 895,1414"/>
    <polygon points="450,192 -296,-873 -140,-966"/>
  </g>
  <rect width="1600" height="500" fill="url(#b2-halo)"/>

  <!-- Left edge: angular slabs + circuit traces -->
  <polygon points="0,0 170,0 60,500 0,500" fill="#12294B" opacity=".55"/>
  <polygon points="190,0 214,0 104,500 80,500" fill="#22D3EE" opacity=".06"/>
  <g fill="none" stroke="#22D3EE" stroke-opacity=".3" stroke-width="1.5">
    <path d="M312 192H236L206 222H0"/>
    <path d="M330 280L284 326H120L96 350H0"/>
    <path d="M330 104L290 64H0"/>
  </g>
  <g fill="#22D3EE" opacity=".6">
    <circle cx="236" cy="192" r="3"/>
    <circle cx="120" cy="326" r="3"/>
    <circle cx="290" cy="64" r="3"/>
  </g>

  <!-- Right edge: seal watermark + game-colour stripes -->
  <g fill="none" stroke="#4B85FF" stroke-opacity=".12" stroke-width="2">
    <polygon points="1480,40 1662,145 1662,355 1480,460 1298,355 1298,145"/>
    <polygon points="1480,110 1601,180 1601,320 1480,390 1359,320 1359,180"/>
  </g>
  <g opacity=".38">
    <polygon points="1530,0 1540,0 1430,500 1420,500" fill="#0FA7A0"/>
    <polygon points="1556,0 1566,0 1456,500 1446,500" fill="#7C5CFF"/>
    <polygon points="1582,0 1592,0 1482,500 1472,500" fill="#E0961B"/>
    <polygon points="1608,0 1618,0 1508,500 1498,500" fill="#E2404F"/>
  </g>
  <g fill="none" stroke="#8FA9DC" stroke-opacity=".25" stroke-width="1.5">
    <path d="M1600 88H1390L1360 118"/>
    <path d="M1600 420H1400"/>
  </g>

  <!-- Particles -->
  <g fill="#A5F3FC">
    <circle cx="612" cy="70" r="2" opacity=".7"/>
    <circle cx="640" cy="330" r="1.5" opacity=".5"/>
    <circle cx="258" cy="140" r="2" opacity=".6"/>
    <circle cx="300" cy="360" r="1.5" opacity=".5"/>
    <circle cx="182" cy="250" r="2.5" opacity=".45"/>
    <circle cx="80" cy="110" r="1.5" opacity=".5"/>
    <circle cx="40" cy="420" r="2" opacity=".4"/>
    <circle cx="560" cy="430" r="2" opacity=".45"/>
    <circle cx="880" cy="40" r="1.5" opacity=".5"/>
    <circle cx="1040" cy="30" r="2" opacity=".35"/>
    <circle cx="1350" cy="220" r="2" opacity=".5"/>
    <circle cx="1395" cy="300" r="1.5" opacity=".45"/>
    <circle cx="1560" cy="250" r="2" opacity=".4"/>
    <circle cx="1240" cy="440" r="1.5" opacity=".4"/>
    <circle cx="960" cy="450" r="2" opacity=".3"/>
    <circle cx="1500" cy="30" r="1.5" opacity=".5"/>
  </g>

  <!-- Bottom fade under the dot strip -->
  <rect y="360" width="1600" height="140" fill="url(#b2-floor)"/>
  <path d="M0 470H1600" stroke="#22D3EE" stroke-opacity=".12"/>

  <!-- ============ SAFE ZONE: x 280-1320, y 55-410 ============ -->

  <!-- Emblem: hex plate, HUD ring, layered shield, check nodes (center 450,192) -->
  <g>
    <polygon points="450,74 552,133 552,251 450,310 348,251 348,133" fill="url(#b2-plate)" stroke="#22D3EE" stroke-opacity=".35" stroke-width="2"/>
    <circle cx="450" cy="192" r="128" fill="none" stroke="#8FA9DC" stroke-opacity=".18"/>
    <circle cx="450" cy="192" r="138" fill="none" stroke="#22D3EE" stroke-opacity=".6" stroke-width="2.5" stroke-dasharray="52 10 8 10" transform="rotate(-20 450 192)"/>

    <!-- Shield glow + body -->
    <path d="M450 92L532 120V196C532 250 496 282 450 300C404 282 368 250 368 196V120Z" fill="none" stroke="#22D3EE" stroke-width="10" opacity=".7" filter="url(#b2-glow)"/>
    <path d="M450 92L532 120V196C532 250 496 282 450 300C404 282 368 250 368 196V120Z" fill="url(#b2-shield)" stroke="url(#b2-rim)" stroke-width="4" stroke-linejoin="round"/>
    <path d="M450 110L516 133V196C516 241 487 267 450 283C413 267 384 241 384 196V133Z" fill="url(#b2-core)" stroke="#22D3EE" stroke-opacity=".35" stroke-width="1.5"/>
    <path d="M450 110L384 133V196C384 241 413 267 450 283Z" fill="#FFFFFF" opacity=".05"/>
    <path d="M374 123L450 97" stroke="#FFFFFF" stroke-opacity=".75" stroke-width="2" stroke-linecap="round"/>

    <!-- Check mark -->
    <path d="M412 196L440 224L494 166" fill="none" stroke="#22D3EE" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" opacity=".8" filter="url(#b2-glow)"/>
    <path d="M412 196L440 224L494 166" fill="none" stroke="url(#b2-check)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Orbit check nodes -->
    <g fill="#0A1830" stroke="#22D3EE" stroke-width="2">
      <circle cx="563" cy="113" r="13"/>
      <circle cx="337" cy="271" r="13"/>
    </g>
    <g fill="none" stroke="#4ADE80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M557 113L561 117L569 108"/>
      <path d="M331 271L335 275L343 266"/>
    </g>
    <path d="M563 259L566 268L575 271L566 274L563 283L560 274L551 271L560 268Z" fill="#A5F3FC"/>
    <path d="M337 103L339 109L345 111L339 113L337 119L335 113L329 111L335 109Z" fill="#A5F3FC" opacity=".8"/>
  </g>

  <!-- Eyebrow: brand mark + label -->
  <g transform="translate(660 76) scale(.231)" fill="#22D3EE">
    <path d="M0 0h19.91v86.58H0Z"/><path d="M26.84 0h56.28L69.26 19.91H26.84Z"/><path d="M26.84 33.33h35.5L48.49 53.25H26.84Z"/><path d="M26.84 66.67h56.28L69.26 86.58H26.84Z"/>
  </g>
  <text x="692" y="93" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="18" letter-spacing="5" fill="#8FA9DC">EXABYTE MARKETPLACE</text>
  <path d="M1000 87H1090L1098 79" fill="none" stroke="#22D3EE" stroke-opacity=".45" stroke-width="2"/>

  <!-- Headline -->
  <text x="656" y="178" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="94" letter-spacing="3" fill="url(#b2-head1)">VERIFIED</text>
  <text x="656" y="266" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="94" letter-spacing="3" fill="url(#b2-head2)">SELLERS</text>

  <!-- Verified seal next to headline -->
  <g transform="translate(1188 144)">
    <rect x="-20" y="-20" width="40" height="40" rx="4" fill="#22D3EE"/>
    <rect x="-20" y="-20" width="40" height="40" rx="4" fill="#22D3EE" transform="rotate(45)"/>
    <path d="M-10 0L-3 7L11 -8" fill="none" stroke="#0A1830" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- HUD rule after SELLERS -->
  <g stroke="#22D3EE" stroke-opacity=".5" stroke-width="2" fill="none">
    <path d="M1150 236H1296"/>
    <path d="M1170 228V244M1200 230V242M1230 230V242M1260 230V242"/>
  </g>
  <rect x="1290" y="230" width="12" height="12" fill="#22D3EE" transform="rotate(45 1296 236)"/>

  <!-- Sub-line -->
  <text x="658" y="314" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="26" letter-spacing="1.5" fill="#A9BBDD">CONTACT SELLERS DIRECTLY<tspan fill="#22D3EE"> · NO SIGN-UP</tspan></text>

  <!-- Feature chips (cut-corner HUD tags) -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="24" letter-spacing="1.5" fill="#EAF2FF">
    <!-- Chip 1: subscribed resellers -->
    <g transform="translate(313 342)">
      <path d="M12 0H417V40L405 52H0V12Z" fill="url(#b2-chip)" stroke="#22D3EE" stroke-opacity=".55" stroke-width="1.5"/>
      <path d="M0 12L12 0" stroke="#A5F3FC" stroke-width="3"/>
      <g transform="translate(31 26)" fill="#22D3EE">
        <circle cx="-2" cy="-6" r="5.5"/>
        <path d="M-12 11C-12 1 8 1 8 11Z"/>
        <circle cx="9" cy="-7" r="6" fill="#4ADE80"/>
        <path d="M6 -7L8.5 -4.5L12.5 -9.5" fill="none" stroke="#0A1830" stroke-width="2" stroke-linecap="round"/>
      </g>
      <text x="58" y="35">SUBSCRIBED RESELLERS</text>
    </g>
    <!-- Chip 2: direct contact -->
    <g transform="translate(754 342)">
      <path d="M12 0H312V40L300 52H0V12Z" fill="url(#b2-chip)" stroke="#22D3EE" stroke-opacity=".55" stroke-width="1.5"/>
      <path d="M0 12L12 0" stroke="#A5F3FC" stroke-width="3"/>
      <g transform="translate(31 26)">
        <path d="M-12 -10H12V5H-1L-8 11V5H-12Z" fill="none" stroke="#22D3EE" stroke-width="2.5" stroke-linejoin="round"/>
        <g fill="#22D3EE"><circle cx="-5" cy="-2.5" r="2"/><circle cx="0" cy="-2.5" r="2"/><circle cx="5" cy="-2.5" r="2"/></g>
      </g>
      <text x="58" y="35">DIRECT CONTACT</text>
    </g>
    <!-- Chip 3: 4 games -->
    <g transform="translate(1090 342)">
      <path d="M12 0H196V40L184 52H0V12Z" fill="url(#b2-chip)" stroke="#22D3EE" stroke-opacity=".55" stroke-width="1.5"/>
      <path d="M0 12L12 0" stroke="#A5F3FC" stroke-width="3"/>
      <g transform="translate(31 26)">
        <rect x="-11" y="-11" width="9.5" height="9.5" rx="1.5" fill="#0FA7A0"/>
        <rect x="1.5" y="-11" width="9.5" height="9.5" rx="1.5" fill="#7C5CFF"/>
        <rect x="-11" y="1.5" width="9.5" height="9.5" rx="1.5" fill="#E0961B"/>
        <rect x="1.5" y="1.5" width="9.5" height="9.5" rx="1.5" fill="#E2404F"/>
      </g>
      <text x="58" y="35"><tspan fill="#22D3EE">4</tspan> GAMES</text>
    </g>
  </g>
</svg>
