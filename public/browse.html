<!DOCTYPE html>
<html lang="en" data-title="Browse accounts — %s">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080d">
<title>Browse accounts</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
</head>

<body class="lang-en">

<header data-header></header>

<main>
    <div class="toolbar" style="position:static; margin-top: 20px;">
        <div class="shell">
            <div class="toolbar-inner">
                <div class="search" id="searchWrap">
                    <span class="ico" id="searchIcon"></span>
                    <input type="search" id="searchInput" autocomplete="off"
                           data-i18n-ph="searchPlaceholder" placeholder="Search…"
                           data-i18n-aria="searchPlaceholder" aria-label="Search">
                    <button type="button" class="clear" id="searchClear" data-i18n-aria="clearSearch" aria-label="Clear"></button>
                </div>

                <div class="price-range" id="priceRange">
                    <input type="number" id="priceMin" min="0" step="1" inputmode="numeric" data-i18n-ph="priceMin" placeholder="Min $" aria-label="Minimum price">
                    <span class="to">–</span>
                    <input type="number" id="priceMax" min="0" step="1" inputmode="numeric" data-i18n-ph="priceMax" placeholder="Max $" aria-label="Maximum price">
                </div>

                <div class="select-wrap">
                    <select id="gameSelect" data-i18n-aria="allGames" aria-label="Game"></select>
                </div>

                <div class="select-wrap">
                    <select id="sortSelect" aria-label="Sort">
                        <option value="newest" data-i18n="sortNewest">Newest first</option>
                        <option value="price_asc" data-i18n="sortPriceAsc">Price: low to high</option>
                        <option value="price_desc" data-i18n="sortPriceDesc">Price: high to low</option>
                        <option value="oldest" data-i18n="sortOldest">Oldest first</option>
                    </select>
                </div>

                <span class="result-count" id="resultCount"></span>
            </div>
        </div>
    </div>

    <div class="shell">
        <div id="grid" class="grid browse-grid" aria-live="polite"></div>
        <div id="pagination" class="pagination"></div>
    </div>

    <div class="shell section-sm">
        <div data-ad="footer" data-ad-variant="wide"></div>
    </div>
</main>

<footer data-footer></footer>

<script src="/js/i18n.js"></script>
<script src="/js/core.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/pages/browse.js"></script>
</body>
</html>
